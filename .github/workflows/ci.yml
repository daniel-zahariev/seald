name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build library
        run: cargo build --locked --lib

      - name: Build binary
        run: cargo build --locked --bin seald

      - name: Test library
        run: cargo test --locked --lib

      - name: Test binary
        run: cargo test --locked --bin seald

  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  build-binaries:
    name: Build binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: seald
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: seald
            deb_arch: arm64
          - os: macos-14
            target: x86_64-apple-darwin
            bin_name: seald
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: seald
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: seald.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --bin seald --target ${{ matrix.target }}

      - name: Prepare tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          mkdir -p package
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} package/${{ matrix.bin_name }}
          tar -czf dist/seald-${{ matrix.target }}.tar.gz -C package ${{ matrix.bin_name }}

      - name: Prepare tarball (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin_name }} package/${{ matrix.bin_name }}
          tar -czf dist/seald-${{ matrix.target }}.tar.gz -C package ${{ matrix.bin_name }}

      - name: Prepare .deb package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKGROOT="pkgroot"
          mkdir -p dist "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin"
          cp "target/${{ matrix.target }}/release/seald" "$PKGROOT/usr/bin/seald"
          chmod 0755 "$PKGROOT/usr/bin/seald"
          printf '%s\n' \
            'Package: seald' \
            "Version: ${VERSION}" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: ${{ matrix.deb_arch }}' \
            'Maintainer: seald contributors' \
            'Description: Encrypt or decrypt files with seald' \
            > "$PKGROOT/DEBIAN/control"
          dpkg-deb --build "$PKGROOT" "dist/seald_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: seald-${{ matrix.target }}
          path: dist/*

  upload-release-assets:
    name: Upload binaries to GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "GPG_PRIVATE_KEY not configured; skipping artifact signing."
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign release artifacts (OpenPGP)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "GPG_PRIVATE_KEY not configured; skipping artifact signing."
            exit 0
          fi

          GPG_PASS_ARGS=(--pinentry-mode loopback --passphrase "${GPG_PASSPHRASE:-}")

          shopt -s globstar nullglob
          for file in release-assets/**/*; do
            if [[ -f "$file" && "$file" != *.asc ]]; then
              if [[ -n "${GPG_KEY_ID:-}" ]]; then
                gpg --batch --yes --no-tty "${GPG_PASS_ARGS[@]}" \
                  --local-user "$GPG_KEY_ID" --armor --detach-sign --output "$file.asc" "$file"
              else
                gpg --batch --yes --no-tty "${GPG_PASS_ARGS[@]}" \
                  --armor --detach-sign --output "$file.asc" "$file"
              fi
            fi
          done

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*

  publish-apt-repo:
    name: Publish APT repository
    runs-on: ubuntu-latest
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Install APT metadata tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build APT repository metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_DIR="pages-root/apt"
          DIST_DIR="$REPO_DIR/dists/stable"
          POOL_DIR="$REPO_DIR/pool/main/s/seald"
          mkdir -p "$POOL_DIR" "$DIST_DIR/main/binary-amd64" "$DIST_DIR/main/binary-arm64"

          shopt -s globstar nullglob
          debs=(release-assets/**/*.deb)
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "No .deb artifacts were found to publish."
            exit 1
          fi
          cp "${debs[@]}" "$POOL_DIR/"

          pushd "$REPO_DIR" >/dev/null

          dpkg-scanpackages --arch amd64 "pool/main/s/seald" /dev/null \
            > "dists/stable/main/binary-amd64/Packages"
          gzip -kf "dists/stable/main/binary-amd64/Packages"

          dpkg-scanpackages --arch arm64 "pool/main/s/seald" /dev/null \
            > "dists/stable/main/binary-arm64/Packages"
          gzip -kf "dists/stable/main/binary-arm64/Packages"

          DATE_RFC2822="$(LC_ALL=C date -Ru)"
          AMD64_MD5="$(md5sum dists/stable/main/binary-amd64/Packages | awk '{print $1}')"
          AMD64_SIZE="$(wc -c < dists/stable/main/binary-amd64/Packages | tr -d ' ')"
          AMD64_GZ_MD5="$(md5sum dists/stable/main/binary-amd64/Packages.gz | awk '{print $1}')"
          AMD64_GZ_SIZE="$(wc -c < dists/stable/main/binary-amd64/Packages.gz | tr -d ' ')"
          ARM64_MD5="$(md5sum dists/stable/main/binary-arm64/Packages | awk '{print $1}')"
          ARM64_SIZE="$(wc -c < dists/stable/main/binary-arm64/Packages | tr -d ' ')"
          ARM64_GZ_MD5="$(md5sum dists/stable/main/binary-arm64/Packages.gz | awk '{print $1}')"
          ARM64_GZ_SIZE="$(wc -c < dists/stable/main/binary-arm64/Packages.gz | tr -d ' ')"

          AMD64_SHA256="$(sha256sum dists/stable/main/binary-amd64/Packages | awk '{print $1}')"
          AMD64_GZ_SHA256="$(sha256sum dists/stable/main/binary-amd64/Packages.gz | awk '{print $1}')"
          ARM64_SHA256="$(sha256sum dists/stable/main/binary-arm64/Packages | awk '{print $1}')"
          ARM64_GZ_SHA256="$(sha256sum dists/stable/main/binary-arm64/Packages.gz | awk '{print $1}')"

          printf '%s\n' \
            'Origin: seald' \
            'Label: seald' \
            'Suite: stable' \
            'Codename: stable' \
            "Version: ${VERSION}" \
            'Architectures: amd64 arm64' \
            'Components: main' \
            'Description: seald APT repository' \
            "Date: $DATE_RFC2822" \
            'MD5Sum:' \
            " $AMD64_MD5 $AMD64_SIZE main/binary-amd64/Packages" \
            " $AMD64_GZ_MD5 $AMD64_GZ_SIZE main/binary-amd64/Packages.gz" \
            " $ARM64_MD5 $ARM64_SIZE main/binary-arm64/Packages" \
            " $ARM64_GZ_MD5 $ARM64_GZ_SIZE main/binary-arm64/Packages.gz" \
            'SHA256:' \
            " $AMD64_SHA256 $AMD64_SIZE main/binary-amd64/Packages" \
            " $AMD64_GZ_SHA256 $AMD64_GZ_SIZE main/binary-amd64/Packages.gz" \
            " $ARM64_SHA256 $ARM64_SIZE main/binary-arm64/Packages" \
            " $ARM64_GZ_SHA256 $ARM64_GZ_SIZE main/binary-arm64/Packages.gz" \
            > "dists/stable/Release"

          popd >/dev/null

      - name: Verify signing key secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "GPG_PRIVATE_KEY must be configured to publish a signed APT repository."
            exit 1
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign APT Release metadata
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          RELEASE_FILE="pages-root/apt/dists/stable/Release"
          INRELEASE_FILE="pages-root/apt/dists/stable/InRelease"
          RELEASE_SIG_FILE="pages-root/apt/dists/stable/Release.gpg"

          if [[ -n "${GPG_KEY_ID:-}" ]]; then
            GPG_KEY_ARGS=(--local-user "$GPG_KEY_ID")
          else
            GPG_KEY_ARGS=()
          fi

          GPG_PASS_ARGS=(--pinentry-mode loopback --passphrase "${GPG_PASSPHRASE:-}")

          gpg --batch --yes --no-tty "${GPG_PASS_ARGS[@]}" \
            "${GPG_KEY_ARGS[@]}" --clearsign --output "$INRELEASE_FILE" "$RELEASE_FILE"
          gpg --batch --yes --no-tty "${GPG_PASS_ARGS[@]}" \
            "${GPG_KEY_ARGS[@]}" --detach-sign --output "$RELEASE_SIG_FILE" "$RELEASE_FILE"

          if [[ -n "${GPG_KEY_ID:-}" ]]; then
            EXPORT_KEY="$GPG_KEY_ID"
          else
            EXPORT_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          fi
          gpg --batch --yes --armor --export "$EXPORT_KEY" > pages-root/apt/seald-archive-keyring.asc
          gpg --batch --yes --export "$EXPORT_KEY" > pages-root/apt/seald-archive-keyring.gpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload APT repo as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

      - name: Deploy APT repo to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
